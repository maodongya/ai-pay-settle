# Grafana + Prometheus + 基础设施 Exporter（全方位监控）
# 启动: ./docs/docker/monitoring/init-monitoring.sh
# Grafana    : http://127.0.0.1:3000  (admin / admin)
# Prometheus : http://127.0.0.1:9090
# cAdvisor   : http://127.0.0.1:8082

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: pay-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: pay-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pay-infra-fullstack.json
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: pay-node-exporter
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: pay-cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    restart: unless-stopped

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: pay-mysqld-exporter
    ports:
      - "9104:9104"
    volumes:
      - ./mysql-exporter.cnf:/etc/mysqld_exporter/.my.cnf:ro
    command:
      - "--config.my-cnf=/etc/mysqld_exporter/.my.cnf"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: pay-redis-exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "${REDIS_EXPORTER_ADDR:-host.docker.internal:6379}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

  rocketmq-exporter:
    image: apache/rocketmq-exporter:0.0.2-SNAPSHOT
    container_name: pay-rocketmq-exporter
    ports:
      - "5557:5557"
    environment:
      rocketmq.config.namesrvAddr: "${ROCKETMQ_NAMESRV:-host.docker.internal:9877}"
      rocketmq.config.rocketmqVersion: V4_9_6
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
