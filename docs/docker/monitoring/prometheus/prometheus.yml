global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pay-settle
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ["host.docker.internal:18089"]
        labels:
          application: pay-settle
          env: local

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: docker-host

  - job_name: cadvisor
    scrape_interval: 20s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]
        labels:
          service: mysql8

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis7

  - job_name: rocketmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rocketmq-exporter:5557"]
        labels:
          Env: local
          Cluster: pay-settle
