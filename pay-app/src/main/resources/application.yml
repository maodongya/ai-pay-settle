server:
  port: 18089

spring:
  application:
    name: pay-settle
  profiles:
    active: mysql
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data-mysql.sql
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true

payment:
  redis:
    enabled: true

pay:
  db:
    init:
      enabled: true
  account:
    enabled: false
    tenant-id: TENANT_DEMO
    caller-id: ai-pay-settle
    url: dubbo://127.0.0.1:50051
    posting-mode: LOCAL
    currency: CNY
    dispatch-interval-ms: 3000
  shard:
    enabled: false
  mq:
    enabled: false
    name-server: 127.0.0.1:9876
    producer-group: pay-settle-producer
    clearance-via-mq: true
    outbox-via-mq: true
    payment-callback-via-mq: true
  outbox:
    dispatch-interval-ms: 3000
  compensate:
    split-interval-ms: 600000
    outbox-interval-ms: 600000
    bill-route-interval-ms: 600000
  clearance:
    retry-interval-ms: 3600000
    watchdog-interval-ms: 300000
  settle:
    t1-cron: "0 0 2 * * ?"
    reconcile-cron: "0 0 4 * * ?"
    payment-retry-cron: "0 30 * * * ?"
  monitor:
    db:
      enabled: true
      check-interval-ms: 300000
    tps:
      enabled: true
      check-interval-ms: 60000
      gap-warn: 30
      gap-critical: 100
      drop-ratio-warn: 0.3
      drop-ratio-critical: 0.5

dubbo:
  application:
    name: pay-settle-consumer
    qos-enable: false
    serialize-check-status: DISABLE
  protocol:
    name: dubbo
    serialization: fastjson2
    prefer-serialization: fastjson2
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:N/A}
  consumer:
    timeout: 3000
    retries: 0
    check: false

logging:
  level:
    com.payment: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: pay-settle

---
# pay.db.init.enabled=false 时跳过 SQL 初始化（适用于已有数据的 MySQL 环境）
spring:
  config:
    activate:
      on-property:
        name: pay.db.init.enabled
        having-value: false
  sql:
    init:
      mode: never
