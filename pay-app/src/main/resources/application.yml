server:
  port: 18089

spring:
  application:
    name: pay-settle
  profiles:
    active: mysql
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data-mysql.sql
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true

pay:
  db:
    init:
      enabled: true
  mq:
    enabled: false
    name-server: 127.0.0.1:9876
    producer-group: pay-settle-producer
    clearance-via-mq: true
    outbox-via-mq: true
    payment-callback-via-mq: true
  outbox:
    dispatch-interval-ms: 3000
  compensate:
    split-interval-ms: 600000
  clearance:
    retry-interval-ms: 3600000
    watchdog-interval-ms: 300000
  settle:
    t1-cron: "0 0 2 * * ?"
    reconcile-cron: "0 0 4 * * ?"
    payment-retry-cron: "0 30 * * * ?"

logging:
  level:
    com.payment: INFO

---
# pay.db.init.enabled=false 时跳过 SQL 初始化（适用于已有数据的 MySQL 环境）
spring:
  config:
    activate:
      on-property:
        name: pay.db.init.enabled
        having-value: false
  sql:
    init:
      mode: never
